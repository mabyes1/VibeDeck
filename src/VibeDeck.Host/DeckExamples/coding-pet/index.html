<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Coding Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pet-shell">
    <div class="pet-stage" aria-label="Coding Pet">
      <div class="stars" aria-hidden="true"></div>
      <div id="cat" class="cat" aria-hidden="true">
        <span class="pixel-tail"></span>
        <span class="pixel-body"></span>
        <span class="pixel-hoodie"></span>
        <span class="pixel-head">
          <span class="pixel-ear left"><i></i></span>
          <span class="pixel-ear right"><i></i></span>
          <span class="pixel-fringe one"></span>
          <span class="pixel-fringe two"></span>
          <span class="pixel-eye left"><i></i></span>
          <span class="pixel-eye right"><i></i></span>
          <span class="pixel-cheek left"></span>
          <span class="pixel-cheek right"></span>
          <span class="pixel-nose"></span>
          <span class="pixel-mouth"></span>
        </span>
        <span class="pixel-paw left"></span>
        <span class="pixel-paw right"></span>
        <span class="pixel-badge">&lt;/&gt;</span>
      </div>
      <p id="status" class="status">compiling tiny victories…</p>
    </div>
    <section class="pet-panel">
      <span class="eyebrow">VIBEDECK EXAMPLE</span>
      <h1>Coding Pet</h1>
      <p>A whole Deck can be nothing more than HTML, CSS and JavaScript.</p>
      <div class="stats">
        <div><strong id="focusMinutes">00</strong><span>focus min</span></div>
        <div><strong id="keystrokes">000</strong><span>imaginary keys</span></div>
      </div>
      <button id="boop" type="button">Boop the cat</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
